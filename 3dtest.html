<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>3D World - WASD Control</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
      }
      canvas {
        display: block;
      }

      .mobile-controls {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        z-index: 20;
        display: none;
        grid-template-columns: 64px 64px 64px;
        grid-template-rows: 64px 64px 64px;
        grid-template-areas:
          ". up ."
          "left . right"
          ". down .";
        gap: 10px;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      .ctrl-btn {
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 14px;
        background: rgba(20, 28, 45, 0.7);
        color: #fff;
        font-size: 26px;
        font-weight: 700;
        line-height: 1;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      }

      .ctrl-btn:active {
        transform: scale(0.96);
        background: rgba(35, 52, 82, 0.9);
      }

      .ctrl-up {
        grid-area: up;
      }

      .ctrl-left {
        grid-area: left;
      }

      .ctrl-right {
        grid-area: right;
      }

      .ctrl-down {
        grid-area: down;
      }

      @media (max-width: 900px), (pointer: coarse) {
        .mobile-controls {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <div class="mobile-controls" aria-label="Mobile movement controls">
      <button type="button" class="ctrl-btn ctrl-up" data-key="forward" aria-label="Move forward">▲</button>
      <button type="button" class="ctrl-btn ctrl-left" data-key="left" aria-label="Turn left">◀</button>
      <button type="button" class="ctrl-btn ctrl-right" data-key="right" aria-label="Turn right">▶</button>
      <button type="button" class="ctrl-btn ctrl-down" data-key="backward" aria-label="Move backward">▼</button>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three"
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js"
      import { OrbitControls } from "three/addons/controls/OrbitControls.js"
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js"
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js"
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js"

      // --- 1. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
      let bird, tree, particles, bush, hedge, trashcan
      const moveSpeed = 0.02
      const rotationSpeed = 0.03
      const keys = { forward: false, backward: false, left: false, right: false }
      const controlButtons = document.querySelectorAll(".ctrl-btn")

      const setKeyState = (keyName, isPressed) => {
        if (Object.prototype.hasOwnProperty.call(keys, keyName)) {
          keys[keyName] = isPressed
        }
      }

      const resetMovementKeys = () => {
        keys.forward = false
        keys.backward = false
        keys.left = false
        keys.right = false
      }

      controlButtons.forEach((button) => {
        const keyName = button.dataset.key

        button.addEventListener("pointerdown", (event) => {
          event.preventDefault()
          setKeyState(keyName, true)
        })

        const release = (event) => {
          event.preventDefault()
          setKeyState(keyName, false)
        }

        button.addEventListener("pointerup", release)
        button.addEventListener("pointercancel", release)
        button.addEventListener("pointerleave", release)
      })

      window.addEventListener("blur", resetMovementKeys)
      window.addEventListener("pagehide", resetMovementKeys)

      // --- 2. СЦЕНА, КАМЕРА, РЕНДЕРЕР ---
      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0x87ceeb)
      scene.fog = new THREE.Fog(0x87ceeb, 30, 30)

      const camera = new THREE.PerspectiveCamera(20, window.innerWidth / window.innerHeight, 0.1, 1000)
      camera.position.set(5, 5, 5)

      const renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setSize(window.innerWidth, window.innerHeight)
      renderer.shadowMap.enabled = true
      renderer.shadowMap.type = THREE.PCFSoftShadowMap
      document.body.appendChild(renderer.domElement)

      // --- 3. ПОСТ-ОБРАБОТКА (BLOOM) ---
      const composer = new EffectComposer(renderer)
      composer.addPass(new RenderPass(scene, camera))
      const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.4, 0.4, 0.85)
      composer.addPass(bloomPass)

      // --- 4. КОНТРОЛЛЕРЫ (ORBIT) ---
      const controls = new OrbitControls(camera, renderer.domElement)
      controls.enableDamping = true
      // ВАЖНО: Отключаем клавиши OrbitControls, чтобы они не мешали нашей птице
      controls.listenToKeyEvents(window)
      controls.enableKeys = false

      // --- 5. СВЕТ ---
      scene.add(new THREE.AmbientLight(0xffffff, 1.5))
      const sun = new THREE.DirectionalLight(0xffffff, 2)
      sun.position.set(5, 10, 7)
      sun.castShadow = true
      scene.add(sun)

      // --- 6. ОБЪЕКТЫ (ПОЛ) ---
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(8, 10), new THREE.MeshStandardMaterial({ color: 0x228b22 }))
      ground.rotation.x = -Math.PI / 2
      ground.receiveShadow = true
      scene.add(ground)

      // --- 7. ЧАСТИЦЫ (ПЫЛЬ) ---
      const particleCount = 50
      const pGeometry = new THREE.BufferGeometry()
      const pPositions = new Float32Array(particleCount * 3)
      pGeometry.setAttribute("position", new THREE.BufferAttribute(pPositions, 3))
      particles = new THREE.Points(
        pGeometry,
        new THREE.PointsMaterial({ color: 0xffffff, size: 0.05, transparent: true, opacity: 0.5 }),
      )
      scene.add(particles)

      // --- 8. ЗАГРУЗКА МОДЕЛЕЙ ---
      const loader = new GLTFLoader()

      // Птица
      loader.load("./Test-Theejs/Pretty-park-set-glb/Bird.glb", (gltf) => {
        bird = gltf.scene
        bird.scale.set(1.5, 1.5, 1.5)
        bird.traverse((n) => {
          if (n.isMesh) n.castShadow = true
        })
        scene.add(bird)
      })

      // Дерево
      loader.load("./Test-Theejs/Pretty-park-set-glb/Tree Large.glb", (gltf) => {
        tree = gltf.scene
        tree.position.set(2, 0, 2)
        tree.scale.set(0.5, 0.5, 0.5)
        tree.traverse((n) => {
          if (n.isMesh) n.castShadow = true
        })
        scene.add(tree)
      })

      loader.load("./Test-Theejs/Pretty-park-set-glb/Tree Large.glb", (gltf) => {
        tree = gltf.scene
        tree.position.set(1, 0, 2)
        tree.scale.set(0.5, 0.5, 0.5)
        tree.traverse((n) => {
          if (n.isMesh) n.castShadow = true
        })
        scene.add(tree)
      })

      // Дерево
      loader.load("./Test-Theejs/Pretty-park-set-glb/Tree Large.glb", (gltf) => {
        tree = gltf.scene
        tree.position.set(-1, 0, -2)
        tree.scale.set(0.5, 0.5, 0.5)
        tree.traverse((n) => {
          if (n.isMesh) n.castShadow = true
        })
        scene.add(tree)
      })
      // Дерево
      loader.load("./Test-Theejs/Pretty-park-set-glb/Tree Large.glb", (gltf) => {
        tree = gltf.scene
        tree.position.set(0, 0, -2)
        tree.scale.set(0.5, 0.5, 0.5)
        tree.traverse((n) => {
          if (n.isMesh) n.castShadow = true
        })
        scene.add(tree)
      })

      // Дерево
      loader.load("./Test-Theejs/Pretty-park-set-glb/Trashcan.glb", (gltf) => {
        trashcan = gltf.scene
        trashcan.position.set(0.1, 0, 1)
        trashcan.scale.set(0.5, 0.5, 0.5)
        trashcan.traverse((n) => {
          if (n.isMesh) n.castShadow = true
        })
        scene.add(trashcan)
      })

      // --- 9. ОБРАБОТКА КЛАВИШ ---
      window.addEventListener("keydown", (e) => {
        if (e.code === "KeyW" || e.code === "ArrowUp") keys.forward = true
        if (e.code === "KeyS" || e.code === "ArrowDown") keys.backward = true
        if (e.code === "KeyA" || e.code === "ArrowLeft") keys.left = true
        if (e.code === "KeyD" || e.code === "ArrowRight") keys.right = true
      })

      window.addEventListener("keyup", (e) => {
        if (e.code === "KeyW" || e.code === "ArrowUp") keys.forward = false
        if (e.code === "KeyS" || e.code === "ArrowDown") keys.backward = false
        if (e.code === "KeyA" || e.code === "ArrowLeft") keys.left = false
        if (e.code === "KeyD" || e.code === "ArrowRight") keys.right = false
      })

      // --- 10. АНИМАЦИЯ ---
      function animate() {
        requestAnimationFrame(animate)

        if (bird) {
          // Поворот
          if (keys.left) bird.rotation.y += rotationSpeed
          if (keys.right) bird.rotation.y -= rotationSpeed

          // Движение вперед/назад относительно направления модели
          const forwardVec = new THREE.Vector3(0, 0, 1).applyQuaternion(bird.quaternion)

          if (keys.forward) bird.position.addScaledVector(forwardVec, moveSpeed)
          if (keys.backward) bird.position.addScaledVector(forwardVec, -moveSpeed)

          // Эффект прыжка при ходьбе
          if (keys.forward || keys.backward) {
            bird.position.y = Math.abs(Math.sin(Date.now() * 0.01)) * 0.15
          } else {
            bird.position.y = THREE.MathUtils.lerp(bird.position.y, 0, 0.1)
          }

          // Вычисляем идеальную позицию камеры относительно птицы
          const relativeCameraOffset = new THREE.Vector3(0, 5, 10) // 5 вверх, 10 назад
          const cameraOffset = relativeCameraOffset.applyMatrix4(bird.matrixWorld)

          // Плавно перемещаем камеру к этой точке
          camera.position.lerp(cameraOffset, 0.1)

          // Всегда смотрим на птицу
          camera.lookAt(bird.position)

          // Частицы
          const posAttr = particles.geometry.attributes.position
          for (let i = 0; i < particleCount; i++) {
            if (Math.random() > 0.95) {
              posAttr.setXYZ(
                i,
                bird.position.x + (Math.random() - 0.5) * 0.2,
                bird.position.y,
                bird.position.z + (Math.random() - 0.5) * 0.2,
              )
            }
            posAttr.array[i * 3 + 1] += 0.01 // Пыль летит вверх
          }
          posAttr.needsUpdate = true
        }

        controls.update()
        composer.render()
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(window.innerWidth, window.innerHeight)
        composer.setSize(window.innerWidth, window.innerHeight)
      })

      animate()
    </script>
  </body>
</html>
